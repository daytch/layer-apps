name: CI/CD Deploy Frontend

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Frontend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22222
          script: |
            set -e

            echo ">>> Load NVM"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            echo ">>> Pakai Node.js 22.19.0"
            nvm use 22.19.0

            echo ">>> Masuk ke project frontend"
            cd /home/daytch/dev/layer-apps

            echo ">>> Update branch dev"
            git fetch origin dev
            git reset --hard origin/dev

            echo ">>> Install dependencies"
            npm ci

            echo ">>> Build Nuxt 3 (SSR)"
            npm run build

            echo ">>> Restart frontend service with pm2"
            pm2 restart nuxt-frontend || pm2 start .output/server/index.mjs --name nuxt-frontend
